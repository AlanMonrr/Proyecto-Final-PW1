<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
<header class="header">
    <div class="header-contenedor">
        <div class="marca">
            <a href="#" class="marca-logo" aria-label="Trama Bolivia, inicio">
                <span class="logo-icono">T</span>
                <span class="marca-nombre">
                    trama
                    <small>BOLIVIA</small>
                </span>
            </a>
        </div>
        <nav class="navegacion" aria-label="Navegación principal">
            <a href="#" class="nav-enlace activo">Explorar</a>
            <a href="#" class="nav-enlace">Guardados</a>
            <a href="#" class="nav-enlace">Cómo aportar</a>
        </nav>
        <div class="header-acciones">

            <button type="button" class="ubicacion">
                <span aria-hidden="true">⌖</span>
                La Paz, Bolivia
                <span aria-hidden="true">⌄</span>
            </button>

            <button type="button" class="btn-reportar">
                <span aria-hidden="true">+</span>
                Reportar
            </button>

            <button type="button" class="btn-menu"
                    aria-label="Abrir menú de navegación">
                ☰
            </button>

        </div>

    </div>
</header>

</body>
</html>
